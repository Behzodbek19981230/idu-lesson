<!DOCTYPE html>
<html lang="uz">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />

   <title>JavaScript Array Lab</title>

   <link rel="stylesheet" href="style.css" />
</head>

<body>

   <header class="header">
      <div>
         <div class="badge">JAVASCRIPT · 01</div>

      </div>

      <div class="array-status">
         <span>products.length</span>
         <strong id="productCount">0</strong>
      </div>
   </header>


   <main>


      <section class="stats">

         <div class="stat-card">
            <div>
               <small>Mahsulotlar</small>
               <strong id="totalProducts">0</strong>
            </div>
         </div>

         <div class="stat-card">
            <div>
               <small>Savat</small>
               <strong id="cartCount">0</strong>
            </div>
         </div>

         <div class="stat-card">
            <div>
               <small>Umumiy summa</small>
               <strong>$<span id="cartTotal">0</span></strong>
            </div>
         </div>

      </section>


      <!-- Controls -->

      <section class="controls">

         <input id="searchInput" type="text" placeholder="🔍 Mahsulot qidirish..." />

         <select id="categoryFilter">
            <option value="all">Barcha kategoriyalar</option>
            <option value="laptop">Laptop</option>
            <option value="phone">Telefon</option>
            <option value="audio">Audio</option>
            <option value="accessory">Aksessuar</option>
         </select>

      </section>


      <!-- Products -->

      <section>

         <div class="section-title">
            <div>
               <h2>Mahsulotlar</h2>
               <p>Array → map() → filter()</p>
            </div>

            <span id="resultCount"></span>
         </div>

         <div id="products" class="products"></div>

      </section>


      <!-- Cart -->

      <section class="cart-section">

         <div class="section-title">
            <div>
               <h2>🛒 Shopping Cart</h2>
               <p>Array → push() → splice() → reduce()</p>
            </div>
         </div>

         <div id="cart" class="cart"></div>

         <div class="cart-footer">
            <span>Jami:</span>

            <strong>
               $<span id="cartTotalBottom">0</span>
            </strong>
         </div>

      </section>



   </main>





   <script src="script.js"></script>

</body>

</html>
